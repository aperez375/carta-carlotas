    // Función robusta para leer CSV con comas dentro de comillas
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal.trim());
          if (currentRow.length > 1 || currentRow[0] !== '') {
            rows.push(currentRow);
          }
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      if (currentVal || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        rows.push(currentRow);
      }
      return rows;
    }

    }

    // Sincronización única y limpia con Google Sheets
    async function sincronizarConGoogleSheets() {
      try {
        const res = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
        if (!res.ok) return;
        const text = await res.text();
        
        const filas = parseCSV(text);
        if (!filas || filas.length <= 1) return;

        const platosCargados = [];
        for (let i = 1; i < filas.length; i++) {
          const col = filas[i];
          if (!col || col.length < 3 || !col[2]) continue;

          const numRaw = col[0] ? col[0].trim() : '';
          const alStr = col[6] ? col[6].trim() : '';
          const alArr = alStr ? alStr.split(/[-;, ]+/).map(x => parseInt(x)).filter(x => !isNaN(x)) : [];
          const precioLimpio = (col[4] || '').replace(/^"|"$/g, '').trim();

          platosCargados.push({
            num: isNaN(numRaw) ? numRaw : parseInt(numRaw),
            cat: (col[1] || '').toLowerCase().trim(),
            nombre: (col[2] || '').trim(),
            en: (col[3] || col[2] || '').trim(),
            precio: precioLimpio,
            desc: (col[5] || '').trim(),
            al: alArr,
            top: (col[7] || '').toUpperCase().includes('TRUE')
          });
        }

        if (platosCargados.length > 0) {
          platos = platosCargados;
		  localStorage.setItem('carlotas_menu_data', JSON.stringify(platosCargados)); // Guarda el menú actualizado
          initDropdown();
          filtrarPlatos();
        }
      } catch (err) {
        console.warn("Usando platos locales por defecto:", err);
      }
    }

    // Inicio inmediato con respaldo y carga de Google Sheets en segundo plano
    initDropdown();
    filtrarPlatos();
    sincronizarConGoogleSheets();
  </script>
